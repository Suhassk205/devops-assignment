apiVersion: apps/v1
kind: Deployment
metadata:
  name: session16-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session16-calculator
  template:
    metadata:
      labels:
        app: session16-calculator
    spec:
      containers:
        - name: calculator
          image: session16-calculator:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
