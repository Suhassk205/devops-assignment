apiVersion: v1
kind: Pod
metadata:
  name: homework-load-generator
  labels:
    app: homework-load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          for worker in $(seq 1 24); do
            while true; do wget -q -O /dev/null http://hpa-demo-service; done &
          done
          wait
      resources:
        requests:
          cpu: 100m
          memory: 16Mi
        limits:
          cpu: "1"
          memory: 64Mi
